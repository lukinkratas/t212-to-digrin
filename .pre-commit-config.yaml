
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: detect-aws-credentials

  - repo: local
    hooks:

      - id: fmt
        name: fmt
        language: system
        entry: make fmt
        pass_filenames: false # Do not pass filenames = runs on all files and not only modified ones

      - id: lint
        name: lint
        language: system
        entry: make lint
        pass_filenames: false

      - id: typecheck
        name: typechk
        language: system
        entry: make typechk
        pass_filenames: false
